name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  ACC_THRESHOLD: 80

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          pip install ruff
           ruff check --select E,F --line-length 100 src/ scripts/

      - name: Build image
        run: docker build --build-arg EPOCHS=3 -t kws-api:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d --name kws -p 8000:8000 kws-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Smoke test
        run: |
          curl -sf http://localhost:8000/model-info
          curl -sf -X POST -F "file=@samples/yes.wav" http://localhost:8000/predict

      - name: Accuracy gate
        run: |
          ACC=$(curl -s http://localhost:8000/model-info | jq '.accuracy')
          echo "accuracy=$ACC, threshold=$ACC_THRESHOLD"
          python3 -c "import sys; sys.exit(0 if $ACC >= $ACC_THRESHOLD else 1)"

      - name: Logs on failure
        if: failure()
        run: docker logs kws || true